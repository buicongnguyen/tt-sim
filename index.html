<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07110f" />
    <meta name="description" content="A repeatable Tenstorrent ttsim field guide with Quasar cluster architecture research, Blackhole comparisons, and WSL2 experiments." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TT•SIM Lab — a hardware-free Tenstorrent field guide" />
    <meta property="og:description" content="Study Quasar clusters versus Blackhole cores, run source-backed simulator experiments, and keep reproducible evidence." />
    <meta property="og:url" content="https://buicongnguyen.github.io/tt-sim/" />
    <meta property="og:image" content="https://buicongnguyen.github.io/tt-sim/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://buicongnguyen.github.io/tt-sim/og.png" />
    <link rel="icon" href="./favicon.svg" />
    <title>TT•SIM Lab — Quasar & Blackhole field guide</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("ttsim-theme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#07110f" : "#f7f3e8");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
